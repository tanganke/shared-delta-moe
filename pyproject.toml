[project]
name = "shared-delta-moe"
version = "0.1.0"
description = "Top-k SwiGLU MoE as a shared base expert plus per-expert deltas: parameter vs per-matrix output aggregation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
triton = ["triton"]
transformers = ["transformers>=5.13"]

[project.entry-points."vllm.general_plugins"]
shared_delta_moe = "shared_delta_moe.vllm_plugin:register"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "black",
    "transformers==5.16.1",
]
docs = ["sphinx", "myst-parser", "furo", "sphinxcontrib-mermaid>=2.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
