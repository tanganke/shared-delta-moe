[project]
name = "shared-delta-moe"
version = "0.1.0"
description = "Top-k SwiGLU MoE as a shared base expert plus per-expert deltas: parameter vs per-matrix output aggregation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
triton = ["triton"]
transformers = ["transformers>=5.13"]
merging = ["fusion-bench>=0.2.33"]  # merging.py, the HierDeltaMoE converter

[project.entry-points."vllm.general_plugins"]
shared_delta_moe = "shared_delta_moe.vllm_plugin:register"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "black",
    "transformers==5.16.1",
    "fusion-bench>=0.2.33",
]
docs = ["sphinx", "myst-parser", "furo", "sphinxcontrib-mermaid>=2.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# development: an editable clone of fusion_bench next to this repo (git clone https://github.com/tanganke/fusion_bench
# ../fusion_bench), so its fixes apply before a release; pip ignores this and installs fusion-bench from PyPI
fusion-bench = { path = "../fusion_bench", editable = true }
